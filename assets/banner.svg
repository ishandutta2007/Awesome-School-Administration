<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.4;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes floatCap{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(3deg)}}@keyframes floatChart{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes lineFlow{0%{stroke-dashoffset:200}}@keyframes shimmerText{0%{stop-color:#6366f1}50%{stop-color:#ec4899}}.bg-circle,.floating-cap{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.floating-cap{animation:floatCap 4s ease-in-out infinite}.tech-line{stroke-dasharray:10,10;animation:lineFlow 10s linear infinite}</style><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><g stroke="#fff" stroke-width="1" opacity=".1"><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x2="1200" y1="160" y2="160"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="320" y2="320"/><line x1="200" x2="200" y1="0" y2="400"/><line x1="400" x2="400" y1="0" y2="400"/><line x1="600" x2="600" y1="0" y2="400"/><line x1="800" x2="800" y1="0" y2="400"/><line x1="1000" x2="1000" y1="0" y2="400